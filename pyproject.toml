[project]
name = "how-transformers-copy"
version = "0.1.0"
description = "Reproducible experiments on sequence copying in an attention-only transformer"
requires-python = ">=3.11,<3.13"
dependencies = ["transformer-lens>=2,<3", "matplotlib", "jupyterlab"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
